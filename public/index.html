<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onlayn Bilim Sinovi</title>
    <!-- Telegram WebApp kutubxonasi -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f8fafc);
            --text-color: var(--tg-theme-text-color, #1e293b);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #2563eb);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        h2 { text-align: center; font-size: 22px; margin-bottom: 20px; font-weight: 700; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; opacity: 0.8; }
        .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; font-size: 15px; outline: none; background: rgba(255, 255, 255, 0.8); }
        .form-group input:focus { border-color: #2563eb; }
        .btn { background: var(--button-color); color: var(--button-text); border: none; padding: 14px; width: 100%; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        .question-card { background: rgba(0, 0, 0, 0.02); padding: 16px; border-radius: 14px; border: 1px solid rgba(0, 0, 0, 0.05); margin-bottom: 16px; }
        .question-card p { margin-top: 0; font-weight: 600; font-size: 15px; }
        .option-label { display: flex; align-items: center; padding: 10px 12px; margin: 8px 0; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer; font-size: 14px; }
        .option-label input { margin-right: 10px; accent-color: #2563eb; }
        .timer-box { font-size: 15px; font-weight: bold; color: #dc2626; background: #fef2f2; padding: 8px 12px; border-radius: 8px; display: inline-block; margin-bottom: 16px; border: 1px solid #fecaca; }
        #test-section, #result-section { display: none; }
        .result-box { text-align: center; font-size: 20px; color: #16a34a; font-weight: bold; margin-bottom: 20px; background: #f0fdf4; padding: 15px; border-radius: 12px; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. Ro'yxatdan o'tish qismi -->
    <div id="login-section">
        <h2>✨ Bilim Sinoviga Xush Kelibsiz</h2>
        <div class="form-group">
            <label>Ismingiz:</label>
            <input type="text" id="firstName" placeholder="Ismingizni kiriting" required>
        </div>
        <div class="form-group">
            <label>Familiyangiz:</label>
            <input type="text" id="lastName" placeholder="Familiyangizni kiriting" required>
        </div>
        <div class="form-group">
            <label>Guruhingiz:</label>
            <input type="text" id="groupName" placeholder="Masalan: 10-A" required>
        </div>
        <button class="btn" onclick="startTest()">Testni Boshlash</button>
    </div>

    <!-- 2. Test Savollari Qismi -->
    <div id="test-section">
        <div class="timer-box">⏳ Qolgan vaqt: <span id="time">05:00</span></div>
        <div id="questions-container"></div>
        <button class="btn" style="background: #16a34a;" onclick="finishTest()">Testni Yakunlash</button>
    </div>

    <!-- 3. Natija Sahifasi -->
    <div id="result-section">
        <h2>🎉 Test Yakunlandi!</h2>
        <div class="result-box" id="score-text"></div>
        <div id="review-container"></div>
    </div>
</div>

<!-- script.js to'g'ridan-to'g'ri bir papkada bo'lgani uchun shu tarzda ulanadi -->
<script src="script.js"></script>

</body>
</html>
